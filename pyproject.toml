[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-strategy-engine"
version = "0.1.0"
description = "RAG-OS, restructured into the target modular-monolith folder layout."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "sqlmodel>=0.0.47",
    "streamlit>=1.64.0",
]

[project.optional-dependencies]
local = ["faiss-cpu>=1.15.1", "pymupdf>=1.28.2", "rank-bm25>=0.2.2", "sentence-transformers>=6.1.0"]
cloud = ["cohere>=7.1.1", "openai>=3.19.2", "qdrant-client>=1.19.1", "groq>=0.11.0"]
api = ["fastapi>=0.141.0", "uvicorn[standard]>=0.54.0"]
worker = ["celery>=5.6.3", "redis>=8.1.0"]
db = ["psycopg2-binary>=2.9.13", "alembic>=1.20.0"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]

[tool.setuptools.packages.find]
include = ["modules*", "shared*", "apps*"]
exclude = ["tests*"]